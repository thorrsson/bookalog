name: Catalog checks

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Catalog, exchange and authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Install missing schema validator
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
      - name: Restore independent reader dependencies
        run: npm ci --cache "$RUNNER_TEMP/bookalog-npm-$GITHUB_RUN_ID"
      - name: App and cross-language exchange checks
        run: bash script/test-app.sh
      - name: Disposable database regressions
        run: bash script/test-supabase.sh
      - name: Real local provider and data recovery checks
        run: bash script/test-supabase-services.sh

  desktop:
    name: Unsigned ${{ matrix.target }} build
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-15
          - target: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Build unconfigured desktop bundle
        shell: bash
        run: bash script/build-desktop.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookalog-${{ matrix.target }}-unsigned
          path: .cache/desktop/bookalog-${{ matrix.target }}-unsigned.zip
          if-no-files-found: error
          retention-days: 7
