name: Desktop release

# Starts a desktop release. Run it from the Actions tab with the version to
# release: Release Please opens (or updates) the version PR, which bumps
# app/pubspec.yaml and app/CHANGELOG.md; the catalog checks run on it; and it
# merges itself once they pass, unless branch protection requires a review.
# Then Release Please tags the merge desktop-v<version> with a draft release
# and starts Desktop release build on that tag, which signs, notarizes and
# publishes the installers.
#
# If the PR needed a review, approving it resumes the same path once it merges.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop app version to release, e.g. 1.0.4'
        required: true
        type: string
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-desktop
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version-file: .nvmrc
      # The action ignores its release-as input when a manifest config is used,
      # so the CLI is called directly to apply the requested version. Versions
      # are plain MAJOR.MINOR.PATCH: Apple bundle versions and MSIX package
      # versions must be numeric, and MSIX has no pre-release ordering.
      - name: Create or update the desktop release PR
        id: release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid version such as 1.2.1."
            exit 1
          fi
          npm_config_cache="$RUNNER_TEMP/bookalog-npm-$GITHUB_RUN_ID" npx --yes release-please@17.3.0 release-pr \
            --token "$GH_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch "$GITHUB_DEFAULT_BRANCH" \
            --config-file .release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --path app \
            --release-as "$RELEASE_VERSION"
          pr_number="$(gh pr list --base "$GITHUB_DEFAULT_BRANCH" \
            --head "release-please--branches--$GITHUB_DEFAULT_BRANCH--components--desktop" \
            --state open --json number,title \
            --jq ".[] | select(.title | endswith(\" $RELEASE_VERSION\")) | .number")"
          if [[ -z "$pr_number" ]]; then
            echo "::error::No open release PR for desktop $RELEASE_VERSION was found."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # Pull requests opened with the workflow token start no workflows, so
      # the catalog checks are dispatched on the release branch explicitly.
      - name: Test and auto-merge the requested release PR
        id: auto_merge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.release.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER"
          base="$(gh pr view "$pr_number" --json baseRefName --jq .baseRefName)"
          branch="$(gh pr view "$pr_number" --json headRefName --jq .headRefName)"
          sha="$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)"
          url="$(gh pr view "$pr_number" --json url --jq .url)"
          if [[ "$base" != "$GITHUB_DEFAULT_BRANCH" || "$branch" != release-please--* ]]; then
            echo "::error::Refusing to test or merge unexpected release PR $url ($branch -> $base)."
            exit 1
          fi

          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for _ in {1..60}; do
            run_id="$(gh run list --workflow ci.yml --branch "$branch" --commit "$sha" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::The catalog checks did not start for release PR $url."
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_number" --auto --squash
          for _ in {1..12}; do
            state="$(gh pr view "$pr_number" --json state --jq .state)"
            if [[ "$state" == MERGED ]]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::notice::Release PR $url is waiting for a review. Approving it resumes the release once it merges."
          echo "merged=false" >> "$GITHUB_OUTPUT"

      - name: Wait for an approved release PR to merge
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for _ in {1..120}; do
            state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
            if [[ "$state" == MERGED ]]; then
              exit 0
            fi
            if [[ "$state" == CLOSED ]]; then
              echo "::error::The approved release PR was closed without merging."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the approved release PR to merge."
          exit 1

      - name: Create the release after the auto-merge
        id: merged_release
        if: github.event_name == 'workflow_dispatch' && steps.auto_merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event.repository.default_branch }}

      - name: Create the release after an approved merge
        id: reviewed_release
        if: github.event_name == 'pull_request_review'
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event.repository.default_branch }}

      # Tags pushed with the workflow token start no workflows, and a build
      # called from this run would deploy from the default branch, which the
      # release environment refuses. Dispatching it on the tag avoids both:
      # dispatches are the one event the workflow token can start, and the
      # dispatched run's ref is the tag the environment allows.
      - name: Start the tagged desktop build
        if: >-
          steps.merged_release.outputs['app--release_created'] == 'true' ||
          steps.reviewed_release.outputs['app--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merged_release.outputs['app--tag_name'] || steps.reviewed_release.outputs['app--tag_name'] }}
        run: |
          set -euo pipefail
          gh workflow run desktop-release.yml --ref "$TAG"
          echo "Started Desktop release build for $TAG"
          echo "### Started the [desktop build for $TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/desktop-release.yml)" >> "$GITHUB_STEP_SUMMARY"
